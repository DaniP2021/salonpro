<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi cuenta</title>
<style>
  :root {
    color-scheme: dark;
    --oro: #c9a96b; --oro-claro: #f6e7c4; --fondo: #0b0a09; --panel: #141110;
    --texto: #f3ede4; --suave: #a89f92; --tenue: #857c70;
    --borde: rgba(201,169,107,.28); --linea: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 18px 14px 40px;
    background: radial-gradient(120% 90% at 50% 0%, #1d1710 0%, var(--fondo) 55%, #060606 100%);
    color: var(--texto); font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .caja { width: 100%; max-width: 520px; margin: 0 auto; }
  .marca { font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .28em;
           text-transform: uppercase; color: var(--oro); margin-bottom: 12px; }
  h1 { font: 400 25px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 6px;
       background: linear-gradient(100deg, var(--oro-claro), var(--oro) 60%, #8d6f3a);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--suave); font-size: 13.5px; margin: 0 0 18px; }
  .pestanas { display: flex; gap: 6px; margin-bottom: 14px; }
  .pestanas button {
    flex: 1; padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit;
    font-size: 13.5px; font-weight: 600; background: rgba(255,255,255,.04);
    border: 1px solid var(--linea); color: var(--suave);
  }
  .pestanas button.activa { background: rgba(201,169,107,.16); border-color: var(--oro); color: var(--texto); }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 18px;
           padding: 16px; margin-bottom: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .panel h2 { font: 600 14px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 12px; color: var(--suave);
              text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
  label { display: block; font-size: 12.5px; color: var(--suave); margin-bottom: 5px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea {
    width: 100%; padding: 12px 13px; border-radius: 11px; font: inherit; font-size: 15px;
    background: rgba(255,255,255,.05); border: 1px solid var(--linea); color: var(--texto); margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--oro); }
  .doble { display: flex; gap: 8px; }
  .doble > div { flex: 1; }
  button.principal {
    width: 100%; border: 0; border-radius: 12px; padding: 15px 18px; font-size: 15px;
    font-weight: 700; cursor: pointer; font-family: inherit;
    background: linear-gradient(100deg, #dbc08a, #b8934f); color: #171310;
  }
  button.principal:disabled { opacity: .5; }
  .acepta { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--suave); margin: 4px 0 14px; }
  .acepta input { margin-top: 2px; }
  .aviso { font-size: 13px; padding: 11px 13px; border-radius: 10px; margin-bottom: 12px; }
  .aviso.error { background: rgba(190,80,70,.14); border: 1px solid rgba(190,80,70,.4); color: #f0c3bd; }
  .turno { border: 1px solid var(--linea); border-radius: 13px; padding: 12px 13px; margin-bottom: 9px; }
  .turno .cuando { font-weight: 700; font-size: 14.5px; }
  .turno .detalle { color: var(--tenue); font-size: 12.5px; margin-top: 3px; }
  .estado { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; padding: 2px 7px; border-radius: 20px; margin-top: 7px; }
  .estado.pendiente { background: rgba(201,169,107,.18); color: var(--oro-claro); }
  .estado.confirmado { background: rgba(120,180,140,.18); color: #bfe0cb; }
  .estado.atendido { background: rgba(255,255,255,.08); color: var(--suave); }
  .estado.cancelado { background: rgba(190,80,70,.16); color: #f0c3bd; }
  .hilo { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow: auto;
          padding: 4px 2px 10px; }
  .fila-b { display: flex; justify-content: flex-start; }
  .fila-b.derecha { justify-content: flex-end; }
  .burbuja { max-width: 82%; padding: 9px 12px; border-radius: 12px;
             background: rgba(255,255,255,.05); border: 1px solid var(--linea); }
  .burbuja.mia { background: rgba(201,169,107,.16); border-color: rgba(201,169,107,.35); }
  .burbuja .quien { font-size: 10.5px; color: var(--tenue); margin-bottom: 3px; }
  .burbuja .texto { font-size: 13.5px; white-space: pre-wrap; }
  .burbuja .hora { font-size: 10px; color: var(--tenue); margin-top: 4px; text-align: right; }
  .pie { margin-top: 16px; font-size: 12px; color: #6f6659; text-align: center; line-height: 1.6; }
  .vacio { color: var(--tenue); font-size: 13px; text-align: center; padding: 12px 0; }
  .cargando { text-align: center; padding: 30px 0; color: var(--tenue); font-size: 13px; }
</style>
</head>
<body>
<main class="caja">
  <div class="marca" id="marca">Mi cuenta</div>
  <h1 id="titulo">Hola</h1>
  <p class="sub" id="sub"></p>
  <div id="contenido"><div class="cargando">Cargando…</div></div>
  <p class="pie" id="pie"></p>
</main>

<script type="module" src="/js/portal.js"></script>
</body>
</html>
