<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reservar turno</title>
<style>
  :root {
    color-scheme: dark;
    --oro: #c9a96b;
    --oro-claro: #f6e7c4;
    --fondo: #0b0a09;
    --panel: #141110;
    --texto: #f3ede4;
    --suave: #a89f92;
    --tenue: #857c70;
    --borde: rgba(201,169,107,.28);
    --borde-suave: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 20px 16px 40px;
    background: radial-gradient(120% 90% at 50% 0%, #1d1710 0%, var(--fondo) 55%, #060606 100%);
    color: var(--texto);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .caja { width: 100%; max-width: 520px; margin: 0 auto; }
  .marca {
    font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .28em;
    text-transform: uppercase; color: var(--oro); margin-bottom: 14px;
  }
  h1 {
    font: 400 26px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 6px;
    background: linear-gradient(100deg, var(--oro-claro), var(--oro) 60%, #8d6f3a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--suave); font-size: 14px; margin: 0 0 22px; }
  .pasos { display: flex; gap: 6px; margin-bottom: 16px; }
  .pasos i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); }
  .pasos i.hecho { background: var(--oro); }
  .panel {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 18px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .panel h2 { font: 600 15px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 12px; }
  .opcion {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.03); border: 1px solid var(--borde-suave);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    color: inherit; font: inherit;
  }
  .opcion:hover { background: rgba(255,255,255,.06); }
  .opcion.elegida { border-color: var(--oro); background: rgba(201,169,107,.1); }
  .opcion .titulo { font-weight: 600; font-size: 14px; }
  .opcion .meta { color: var(--tenue); font-size: 12px; margin-top: 2px; }
  .opcion .precio { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid var(--borde-suave);
    color: inherit; font: inherit; font-size: 14px; font-weight: 600;
  }
  .chip:hover { border-color: var(--oro); }
  .chip.elegido { background: linear-gradient(100deg, #dbc08a, #b8934f); color: #171310; border-color: transparent; }
  .grupo { margin-bottom: 14px; }
  .grupo .rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--tenue); margin-bottom: 7px; }
  label { display: block; font-size: 12.5px; color: var(--suave); margin-bottom: 5px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], textarea {
    width: 100%; padding: 12px 13px; border-radius: 11px; font: inherit; font-size: 15px;
    background: rgba(255,255,255,.05); border: 1px solid var(--borde-suave); color: var(--texto);
    margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--oro); }
  textarea { resize: vertical; }
  .campo-acepta { display: flex; gap: 9px; align-items: flex-start; margin: 4px 0 14px; font-size: 12.5px; color: var(--suave); }
  .campo-acepta input { margin-top: 2px; }
  button.principal, button.secundario {
    width: 100%; border: 0; border-radius: 12px; padding: 15px 18px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button.principal { background: linear-gradient(100deg, #dbc08a, #b8934f); color: #171310; }
  button.principal:disabled { opacity: .45; cursor: default; }
  button.secundario { background: rgba(255,255,255,.07); color: #e7dfd2; border: 1px solid var(--borde-suave); }
  .fila { display: flex; gap: 8px; margin-top: 12px; }
  .aviso { font-size: 13px; padding: 11px 13px; border-radius: 10px; margin-bottom: 12px; }
  .aviso.error { background: rgba(190,80,70,.14); border: 1px solid rgba(190,80,70,.4); color: #f0c3bd; }
  .aviso.ok { background: rgba(90,150,110,.14); border: 1px solid rgba(90,150,110,.4); color: #bfe0cb; }
  .resumen { display: grid; gap: 9px; margin: 4px 0 16px; }
  .resumen .linea { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--borde-suave); }
  .resumen .linea span:first-child { color: var(--tenue); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .resumen .linea span:last-child { font-weight: 600; font-size: 14px; text-align: right; }
  .vacio { color: var(--tenue); font-size: 13px; text-align: center; padding: 14px 0; }
  .pie { margin-top: 18px; font-size: 12px; color: #6f6659; text-align: center; line-height: 1.6; }
  .cargando { text-align: center; padding: 30px 0; color: var(--tenue); font-size: 13px; }
  .grande { text-align: center; padding: 8px 0 4px; }
  .grande .icono { font-size: 44px; margin-bottom: 8px; }
</style>
</head>
<body>
<main class="caja">
  <div class="marca" id="marca">Reservá tu turno</div>
  <h1 id="titulo">Elegí tu turno</h1>
  <p class="sub" id="sub">Paso 1 de 3 · elegí el servicio</p>

  <div class="pasos" id="pasos"><i class="hecho"></i><i></i><i></i></div>

  <div id="contenido">
    <div class="cargando">Cargando…</div>
  </div>

  <p class="pie" id="pie"></p>
</main>

<script type="module" src="/js/reservar.js"></script>
</body>
</html>
